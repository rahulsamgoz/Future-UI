# Managed historical capture run (R2 streams D+H).
#
# workflow_dispatch only: a human schedules a capture set against a running
# app. The stack (api + runner-manager + reference app dev server) is started
# in-process, a pool of 2 capture-runner workers joins the manager, and the
# CLI submits + polls the run. Artifacts: the run result and the capture
# coverage report.
#
# Durable publication (audit finding): the managed executors publish every
# capture to the history API and verify the publication — a scenario is only
# reported "captured" after its capture is durably stored. The publication
# target is wired via HISTORY_API_URL / HISTORY_API_TOKEN / HISTORY_API_PROJECT
# (read by @ui-intelligence/capture's historyApiFromEnv in
# apps/runner-manager/src/executor.ts and apps/capture-runner/src/managed.ts,
# and propagated by apps/runner-manager/src/pool.ts to spawned workers).
# Without it the run would execute captures but publish NOTHING, so the env
# below is required configuration, not a convenience.
#
# Not executed in the dev sandbox (no GitHub runners); YAML validated locally.

on:
  workflow_dispatch:
    inputs:
      repoUrl:
        description: Repository URL recorded on the run
        required: true
        default: https://github.com/rahulsamgoz/Future-UI
      commitSha:
        description: Commit SHA to capture (defaults to the checked-out HEAD)
        required: false
      scenarios:
        description: Comma-separated scenario ids
        required: false
        default: catalog-default-desktop,catalog-empty-desktop

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      UI_INTEL_TOKEN: dev-token
      RUNNER_TOKEN: dev-token
      UI_INTEL_DB: /home/runner/work/ui-intelligence.sqlite
      RUNNER_DB: /home/runner/work/runner.sqlite
      UI_INTEL_STORE: /home/runner/work/artifacts
      # Durable publication target for the managed worker pool (see header).
      HISTORY_API_URL: http://localhost:8787
      HISTORY_API_TOKEN: dev-token
      HISTORY_API_PROJECT: proj_reference_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build services and CLI
        run: npx tsc -b packages/cli apps/api apps/runner-manager apps/capture-runner

      - name: Install browser for capture workers
        run: npx playwright install --with-deps chromium

      # Service stack. The DB is the API's embedded SQLite (created/migrated by
      # apps/api at boot from UI_INTEL_DB), started as part of the API service
      # process; there is no separate DB daemon in this stack. Every service
      # runs in the background and the step FAILS if any health endpoint does
      # not come up — a half-started stack must not reach the submit step.
      - name: Start services (api + db, runner-manager pool, reference app)
        run: |
          node apps/api/dist/server.js > api.log 2>&1 &
          echo $! > api.pid
          APP_URL=http://localhost:5173 RUNNER_POOL_COUNT=2 node apps/runner-manager/dist/server.js > runner-manager.log 2>&1 &
          echo $! > runner-manager.pid
          (cd apps/reference-app && exec npx vite --port 5173 --strictPort) > vite.log 2>&1 &
          echo $! > vite.pid

          wait_for() {
            local name="$1" url="$2"
            for _ in $(seq 1 60); do
              if curl -sf "$url" > /dev/null; then
                echo "$name is up: $url"
                return 0
              fi
              sleep 1
            done
            echo "::error::$name failed to become healthy at $url"
            exit 1
          }
          wait_for "api" http://localhost:8787/health
          wait_for "runner-manager" http://localhost:8900/health
          wait_for "reference-app" http://localhost:5173

      - name: Submit the managed capture run
        run: |
          SHA="${{ inputs.commitSha }}"
          if [ -z "$SHA" ]; then SHA="$(git rev-parse HEAD)"; fi
          node packages/cli/dist/cli.js history submit \
            --repo "${{ inputs.repoUrl }}" \
            --commit "$SHA" \
            --scenarios "${{ inputs.scenarios }}" \
            --manager http://localhost:8900 \
            --project proj_reference_app \
            --out run-result.json
          cat run-result.json

      - name: Coverage report
        run: |
          node fixtures/history/coverage.mjs \
            --app http://localhost:5173 \
            --api http://localhost:8787 \
            --token dev-token \
            --project proj_reference_app \
            --out coverage-report.json

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capture-run
          path: |
            run-result.json
            coverage-report.json
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          for f in vite.pid runner-manager.pid api.pid; do
            if [ -f "$f" ]; then
              kill "$(cat "$f")" 2>/dev/null || true
              rm -f "$f"
            fi
          done
          for log in api.log runner-manager.log vite.log; do
            [ -f "$log" ] && { echo "--- $log ---"; tail -50 "$log"; }
          done
