name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (workspace build)
        run: npx tsc -b

      - name: Unit tests (hermetic — UI_INTEL_E2E unset)
        run: npx vitest run
        env:
          UI_INTEL_E2E: ""
