# Studio SPA + API proxy (dev profile). The built studio calls /v1
# same-origin (VITE_API_BASE is empty); nginx forwards it to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: studio -> nginx -> api:8787 (compose service name "api").
    location /v1/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        client_max_body_size 25m;
    }
}
