# Reference app SPA + API proxy. The editor talks to /v1 same-origin by
# default; nginx forwards it to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /v1/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        client_max_body_size 25m;
    }

    # Public build manifest emitted by the vite plugin.
    location /.ui-intelligence/ {
        try_files $uri =404;
    }
}
